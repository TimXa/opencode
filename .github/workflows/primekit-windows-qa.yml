name: PrimeKit Windows QA

on:
  workflow_dispatch:
  push:
    branches: [primekit-brand]

permissions:
  contents: read

concurrency:
  group: primekit-windows-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCODE_CHANNEL: prod
      OPENCODE_VERSION: 1.18.17
      PRIMEKIT_UNSIGNED_QA: "1"
      RUST_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Checkout PrimeKit backend E2E source
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          repository: TimXa/Omar1
          ref: main
          path: primekit-backend-source
          token: ${{ secrets.PRIMEKIT_CI_REPO_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: primekit-backend-source/MinecraftAI_Backend/tests/e2e/requirements-portable.txt

      - name: Install portable E2E backend
        run: python -m pip install -r primekit-backend-source/MinecraftAI_Backend/tests/e2e/requirements-portable.txt

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Smoke Computer Use runtime
        working-directory: packages/desktop
        run: bun run smoke:computer

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

      - name: Prepare target-native resources
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build renderer and main process
        working-directory: packages/desktop
        run: bun run build

      - name: Package unsigned QA installer
        working-directory: packages/desktop
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts

      - name: Verify QA artifacts
        shell: pwsh
        run: |
          $installer = 'packages/desktop/dist/kit-desktop-win-x64.exe'
          $app = 'packages/desktop/dist/win-unpacked/Кит.exe'
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $app)) { throw "Missing unpacked app: $app" }
          $modules = 'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules'
          $pty = Join-Path $modules '@lydell/node-pty-win32-x64'
          if (-not (Test-Path $pty)) { throw "Missing packaged Windows PTY runtime: $pty" }
          $foreignPty = Get-ChildItem (Join-Path $modules '@lydell') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^node-pty-(darwin|linux)' }
          if ($foreignPty) { throw "Packaged foreign PTY runtimes: $($foreignPty.Name -join ', ')" }
          $cua = 'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@trycua/cua-driver-win32-x64-msvc'
          foreach ($file in @('cua_driver_node_runtime.node', 'cua_driver_sdk.dll', 'node-runtime-NOTICE.md')) {
            $path = Join-Path $cua $file
            if (-not (Test-Path $path)) { throw "Missing packaged Computer Use runtime: $path" }
          }
          $requiredNative = @(
            'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@lydell/node-pty-win32-x64/prebuilds/win32-x64/conpty.node',
            'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@lydell/node-pty-win32-x64/prebuilds/win32-x64/conpty/conpty.dll',
            'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@parcel/watcher-win32-x64/watcher.node',
            'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@ubjs/node-win32-x64-msvc/uniffi-runtime-napi.win32-x64-msvc.node',
            'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@msgpackr-extract/msgpackr-extract-win32-x64/node.napi.node'
          )
          foreach ($path in $requiredNative) {
            if (-not (Test-Path $path)) { throw "Missing Windows native runtime: $path" }
          }
          function Assert-X64PE([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
              throw "Not a PE binary: $path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x8664) {
              throw ('Wrong native architecture in {0}: PE machine 0x{1:x4}, expected x64' -f $path, $machine)
            }
          }
          Assert-X64PE $app
          foreach ($path in $requiredNative) { Assert-X64PE $path }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -notin @('NotSigned', 'UnknownError')) {
            throw "Unexpected QA signature state: $($signature.Status)"
          }
          Get-Item $installer, $app | Select-Object Name, Length, VersionInfo

      - name: Smoke packaged Computer Use runtime
        working-directory: packages/desktop
        run: bun run smoke:computer:packaged -- dist/win-unpacked/Кит.exe

      - name: E2E browser account to packaged Windows agent
        shell: pwsh
        env:
          PRIMEKIT_DEV_AUTH: "1"
          PRIMEKIT_PASSWORDLESS_EMAILS: universal-e2e@primekit.test
          PRIMEKIT_LLM_API_KEY: e2e-only
          PRIMEKIT_LLM_BASE_URL: http://127.0.0.1:8081/v1
          PRIMEKIT_LLM_MODEL: e2e/tool-model
          JWT_SECRET: portable-e2e-secret
          PRIMEKIT_E2E_BASE_URL: http://127.0.0.1:18000
          PRIMEKIT_NATIVE_E2E_REQUIRE_COMPUTER: "1"
        run: |
          $backend = (Resolve-Path 'primekit-backend-source/MinecraftAI_Backend').Path
          $database = (Join-Path $env:RUNNER_TEMP 'primekit-native-e2e.db').Replace('\', '/')
          $env:DATABASE_URL = "sqlite:///$database"
          $env:PYTHONPATH = $backend
          $providerOut = Join-Path $env:RUNNER_TEMP 'primekit-provider.log'
          $backendOut = Join-Path $env:RUNNER_TEMP 'primekit-backend.log'
          $provider = Start-Process python -ArgumentList @(
            (Join-Path $backend 'tests/e2e/universal_agent_e2e.py'), 'provider'
          ) -PassThru -RedirectStandardOutput $providerOut -RedirectStandardError "$providerOut.err"
          $server = Start-Process python -ArgumentList @(
            (Join-Path $backend 'scripts/native_smoke_server.py'), '--port', '18000'
          ) -PassThru -RedirectStandardOutput $backendOut -RedirectStandardError "$backendOut.err"
          try {
            $ready = $false
            1..60 | ForEach-Object {
              if (-not $ready) {
                try {
                  $response = Invoke-RestMethod -Uri 'http://127.0.0.1:18000/health' -TimeoutSec 2
                  $ready = $response.status -eq 'ok'
                } catch { Start-Sleep -Seconds 1 }
              }
            }
            if (-not $ready) { throw 'Portable PrimeKit backend did not become ready' }
            Push-Location packages/desktop
            try {
              bun run smoke:universal-agent:packaged -- dist/win-unpacked/Кит.exe
            } finally {
              Pop-Location
            }
          } finally {
            foreach ($process in @($server, $provider)) {
              if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            }
            Get-Content $backendOut, "$backendOut.err", $providerOut, "$providerOut.err" -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primekit-windows-x64-unsigned-qa
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/desktop/dist/kit-desktop-win-x64.exe
            packages/desktop/dist/kit-desktop-win-x64.exe.blockmap
            packages/desktop/dist/win-unpacked/**
