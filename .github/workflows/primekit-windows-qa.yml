name: PrimeKit Windows QA

on:
  workflow_dispatch:
  push:
    branches: [primekit-brand]

permissions:
  contents: read

concurrency:
  group: primekit-windows-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCODE_CHANNEL: prod
      OPENCODE_VERSION: 1.18.15
      RUST_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Smoke Computer Use runtime
        working-directory: packages/desktop
        run: bun run smoke:computer

      - name: Typecheck desktop
        working-directory: packages/desktop
        run: bun run typecheck

      - name: Prepare target-native resources
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build renderer and main process
        working-directory: packages/desktop
        run: bun run build

      - name: Package unsigned QA installer
        working-directory: packages/desktop
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts

      - name: Verify QA artifacts
        shell: pwsh
        run: |
          $installer = 'packages/desktop/dist/kit-desktop-win-x64.exe'
          $app = 'packages/desktop/dist/win-unpacked/Кит.exe'
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $app)) { throw "Missing unpacked app: $app" }
          $modules = 'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules'
          $pty = Join-Path $modules '@lydell/node-pty-win32-x64'
          if (-not (Test-Path $pty)) { throw "Missing packaged Windows PTY runtime: $pty" }
          $foreignPty = Get-ChildItem (Join-Path $modules '@lydell') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^node-pty-(darwin|linux)' }
          if ($foreignPty) { throw "Packaged foreign PTY runtimes: $($foreignPty.Name -join ', ')" }
          $cua = 'packages/desktop/dist/win-unpacked/resources/app.asar.unpacked/node_modules/@trycua/cua-driver-win32-x64-msvc'
          foreach ($file in @('cua_driver_node_runtime.node', 'cua_driver_sdk.dll', 'node-runtime-NOTICE.md')) {
            $path = Join-Path $cua $file
            if (-not (Test-Path $path)) { throw "Missing packaged Computer Use runtime: $path" }
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -notin @('NotSigned', 'UnknownError')) {
            throw "Unexpected QA signature state: $($signature.Status)"
          }
          Get-Item $installer, $app | Select-Object Name, Length, VersionInfo

      - name: Smoke packaged Computer Use runtime
        working-directory: packages/desktop
        run: bun run smoke:computer:packaged -- dist/win-unpacked/Кит.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primekit-windows-x64-unsigned-qa
          if-no-files-found: error
          retention-days: 14
          path: |
            packages/desktop/dist/kit-desktop-win-x64.exe
            packages/desktop/dist/kit-desktop-win-x64.exe.blockmap
            packages/desktop/dist/win-unpacked/**
